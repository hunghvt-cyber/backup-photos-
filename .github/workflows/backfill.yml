name: Google Photos Historical Backfill

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum historical images/videos to attempt (subject to time budget)"
        required: false
        default: "10000"
  push:
    branches: [upgrade/web-inventory-20261020]
  schedule:
    # Every day 04:45 Vietnam. Serialized with Daily and Reconcile.
    - cron: "45 21 * * *"

permissions:
  contents: read

concurrency:
  group: google-photos-koofr-state
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    # Public standard runner: 5h engine + shutdown/profile/report reserve.
    timeout-minutes: ${{ github.event_name == 'push' && 30 || 330 }}
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
      GPHOTOS_PROFILE_KEY: ${{ secrets.GPHOTOS_PROFILE_KEY }}
      MAX_RUNTIME_SECONDS: ${{ github.event_name == 'push' && '900' || '18000' }}
      MAX_SCAN_SECONDS: "180"
      MAX_ITEMS: ${{ github.event_name == 'push' && '10' || inputs.max_items || '10000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and configure runtime
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KOOFR_USER" && test -n "$KOOFR_APP_PASSWORD" && test -n "$GPHOTOS_PROFILE_KEY"
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y rclone; then break; fi
            sleep 15
          done
          command -v rclone >/dev/null
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          if command -v google-chrome-stable >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          else
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
          mkdir -p "$HOME/.config/rclone"
          PASS="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          {
            echo '[koofr_remote]'
            echo 'type = webdav'
            echo 'url = https://app.koofr.net/dav/Koofr'
            echo 'vendor = other'
            echo "user = $KOOFR_USER"
            echo "pass = $PASS"
          } > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
      - name: Validate backfill implementation
        run: |
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -v
      - name: Restore Chrome profile
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto 'koofr_remote:/Google Photos/.gphotos-sync/auth/profile.tar.gz.enc' /tmp/profile.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in /tmp/profile.enc -out /tmp/profile.tgz -pass env:GPHOTOS_PROFILE_KEY
          tar -C "$HOME" -xzf /tmp/profile.tgz
          rm -f "$HOME/gphotos-profile/SingletonLock" "$HOME/gphotos-profile/SingletonSocket" "$HOME/gphotos-profile/SingletonCookie"
          rm -f /tmp/profile.enc /tmp/profile.tgz
      - name: Historical backfill
        id: backfill
        shell: bash
        run: |
          set -o pipefail
          # Stop a stuck download BEFORE GitHub kills the entire runner.
          # Even on failure, the next always() steps save the Chrome profile
          # and publish a diagnostic report.
          timeout --signal=INT --kill-after=30s ${{ github.event_name == 'push' && '1200s' || '18300s' }} \
            python3 -m src.gphotos_web_backup --scan-seconds ${{ github.event_name == 'push' && '60' || '600' }} 2>&1 | tee "$RUNNER_TEMP/gphotos-backfill.log"
      - name: Persist refreshed Chrome profile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/gphotos-profile" ] || ! command -v rclone >/dev/null; then
            echo "No worker profile to persist"
            exit 0
          fi
          rm -f "$HOME/gphotos-profile/SingletonLock" "$HOME/gphotos-profile/SingletonSocket" "$HOME/gphotos-profile/SingletonCookie"
          # Browser caches are disposable, but auth cookies/storage are not.
          # Excluding caches reduces the encrypted profile uploaded to Koofr
          # after every run without changing its authentication state.
          PROFILE_SAVE_STARTED="$(date +%s)"
          tar -C "$HOME" \
            --exclude='*/Cache' \
            --exclude='*/Code Cache' \
            --exclude='*/GPUCache' \
            --exclude='*/DawnCache' \
            --exclude='*/ShaderCache' \
            --exclude='*/GrShaderCache' \
            --exclude='*/Crashpad' \
            -czf /tmp/profile-refresh.tgz gphotos-profile
          echo "PROFILE_ARCHIVE_BYTES=$(stat -c %s /tmp/profile-refresh.tgz)"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/profile-refresh.tgz -out /tmp/profile-refresh.enc -pass env:GPHOTOS_PROFILE_KEY
          rclone copyto /tmp/profile-refresh.enc 'koofr_remote:/Google Photos/.gphotos-sync/auth/profile.tar.gz.enc' --ignore-times
          echo "PROFILE_PERSIST_SECONDS=$(( $(date +%s) - PROFILE_SAVE_STARTED ))"
          rm -f /tmp/profile-refresh.tgz /tmp/profile-refresh.enc
      - name: Cleanup worker credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$HOME/gphotos-profile" /tmp/gphotos-downloads /tmp/gphotos-state || true
          rm -f "$HOME/.config/rclone/rclone.conf" || true

      - name: Historical backfill report
        if: always()
        shell: bash
        env:
          BACKUP_RESULT: ${{ steps.backfill.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gphotos-backfill.log'
          lines = p.read_text(errors='replace').splitlines() if p.exists() else []
          candidates = [x.split('WEB_SUMMARY=', 1)[1] for x in lines if 'WEB_SUMMARY=' in x]
          if candidates:
              d = json.loads(candidates[-1])
              keys = ('inventory_complete','inventory_error','albums','album_memberships','status','scan_status','scan_rounds','scan_seconds','download_seconds','unique_visible','discovered','attempted','uploaded','uploaded_per_hour','skipped','errors','manifest_uploaded_total','pending_seen','pending_errors')
              report = ['## Google Photos Historical Backfill','', '| Metric | Value |','|---|---|']
              report += [f'| {k} | {d.get(k, "N/A")} |' for k in keys]
              if d.get('errors', 0):
                  report += ['', f"**Partial backup:** {d['errors']} media download(s) failed in this run. Errors remain in the manifest for later repair."]
                  print(f"::warning::Historical Backfill had {d['errors']} download errors; {d.get('uploaded', 0)} uploads succeeded.")
              if d.get('status') not in ('PAUSED_LIMIT', 'PAUSED_TIME'):
                  report += ['', '**Note:** Historical library coverage is not complete; inspect scan status before increasing quotas.']
          else:
              report = ['## Google Photos Historical Backfill','','No final summary; inspect the job logs for an unexpected crash.']
          from datetime import datetime, timezone
          health = dict(d) if candidates else {}
          health['status'] = 'SUCCESS' if candidates and os.environ['BACKUP_RESULT'] == 'success' else 'FAILED / INCOMPLETE'
          health['generated_at_utc'] = datetime.now(timezone.utc).isoformat()
          health['bootstrap_complete'] = False
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'daily-health.json').write_text(json.dumps(health))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(report) + '\n')
          PY

      - name: Publish Google Photos health (selected report backend)
        if: always()
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REPORT_BACKEND: ${{ vars.REPORT_BACKEND || 'gas-drive' }}
          REPORT_GAS_URL: ${{ vars.REPORT_GAS_URL }}
          REPORT_GAS_KEY: ${{ secrets.REPORT_GAS_KEY }}
        run: |
          python3 scripts/backup-summary.py
          case "$REPORT_BACKEND" in
            gas-drive)
              python3 scripts/publish_gas_report.py gphotos-backup-summary.json
              ;;
            blob)
              if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
                echo "::notice::BLOB_READ_WRITE_TOKEN missing; report publishing disabled."
                exit 0
              fi
              python3 -m pip install --disable-pip-version-check 'vercel==0.11.6'
              python3 scripts/publish_blob_report.py gphotos-backup-summary.json gphotos-backup-latest.json
              ;;
            *)
              echo "::error::Unsupported report backend."
              exit 1
              ;;
          esac
