name: Google Photos Daily Backup

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: Maximum new items this run
        required: false
        default: "1000"
  schedule:
    - cron: "17 20 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"

permissions:
  contents: read

concurrency:
  group: google-photos-koofr-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
      GPHOTOS_PROFILE_KEY: ${{ secrets.GPHOTOS_PROFILE_KEY }}
      MAX_RUNTIME_SECONDS: "16800"
      MAX_ITEMS: ${{ inputs.max_items || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KOOFR_USER" && test -n "$KOOFR_APP_PASSWORD" && test -n "$GPHOTOS_PROFILE_KEY"
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y rclone; then break; fi
            sleep 15
          done
          command -v rclone >/dev/null
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          if command -v google-chrome-stable >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          else
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
      - name: Configure Koofr
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          PASS="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          {
            echo '[koofr_remote]'
            echo 'type = webdav'
            echo 'url = https://app.koofr.net/dav/Koofr'
            echo 'vendor = other'
            echo "user = $KOOFR_USER"
            echo "pass = $PASS"
          } > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsf 'koofr_remote:/Google Photos/.gphotos-sync/auth' --include 'profile.tar.gz.enc' | grep -qx 'profile.tar.gz.enc'
      - name: Restore Chrome profile
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto 'koofr_remote:/Google Photos/.gphotos-sync/auth/profile.tar.gz.enc' /tmp/profile.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in /tmp/profile.enc -out /tmp/profile.tgz -pass env:GPHOTOS_PROFILE_KEY
          tar -C "$HOME" -xzf /tmp/profile.tgz
          rm -f "$HOME/gphotos-profile/SingletonLock" "$HOME/gphotos-profile/SingletonSocket" "$HOME/gphotos-profile/SingletonCookie"
          rm -f /tmp/profile.enc /tmp/profile.tgz
      - name: Incremental backup
        run: python3 -m src.gphotos_sync daily
      - name: Persist refreshed Chrome profile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/gphotos-profile" ] || ! command -v rclone >/dev/null; then
            echo "No worker profile to persist"
            exit 0
          fi
          rm -f "$HOME/gphotos-profile/SingletonLock" "$HOME/gphotos-profile/SingletonSocket" "$HOME/gphotos-profile/SingletonCookie"
          tar -C "$HOME" -czf /tmp/profile-refresh.tgz gphotos-profile
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/profile-refresh.tgz -out /tmp/profile-refresh.enc -pass env:GPHOTOS_PROFILE_KEY
          rclone copyto /tmp/profile-refresh.enc 'koofr_remote:/Google Photos/.gphotos-sync/auth/profile.tar.gz.enc' --ignore-times
          rm -f /tmp/profile-refresh.tgz /tmp/profile-refresh.enc
      - name: Cleanup worker credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$HOME/gphotos-profile" /tmp/gphotos-downloads /tmp/gphotos-state || true
          rm -f "$HOME/.config/rclone/rclone.conf" || true
