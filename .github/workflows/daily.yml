name: Google Photos Daily Backup

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: Maximum new items this run
        required: false
        default: "1000"
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

concurrency:
  group: google-photos-koofr-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
      GPHOTOS_PROFILE_KEY: ${{ secrets.GPHOTOS_PROFILE_KEY }}
      MAX_RUNTIME_SECONDS: "16800"
      MAX_ITEMS: ${{ inputs.max_items || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KOOFR_USER" && test -n "$KOOFR_APP_PASSWORD" && test -n "$GPHOTOS_PROFILE_KEY"
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y rclone; then break; fi
            sleep 15
          done
          command -v rclone >/dev/null
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          if command -v google-chrome-stable >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          else
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
      - name: Configure Koofr
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          PASS="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          {
            echo '[koofr_remote]'
            echo 'type = webdav'
            echo 'url = https://app.koofr.net/dav/Koofr'
            echo 'vendor = other'
            echo "user = $KOOFR_USER"
            echo "pass = $PASS"
          } > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsf 'koofr_remote:/Google Photos/.gphotos-sync/auth' --include 'profile.tar.gz.enc' | grep -qx 'profile.tar.gz.enc'
      - name: Restore Chrome profile
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto 'koofr_remote:/Google Photos/.gphotos-sync/auth/profile.tar.gz.enc' /tmp/profile.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in /tmp/profile.enc -out /tmp/profile.tgz -pass env:GPHOTOS_PROFILE_KEY
          tar -C "$HOME" -xzf /tmp/profile.tgz
          rm -f "$HOME/gphotos-profile/SingletonLock" "$HOME/gphotos-profile/SingletonSocket" "$HOME/gphotos-profile/SingletonCookie"
          rm -f /tmp/profile.enc /tmp/profile.tgz
      - name: Incremental backup
        id: backup
        shell: bash
        run: |
          set -o pipefail
          python3 -m src.gphotos_sync daily 2>&1 | tee "$RUNNER_TEMP/gphotos-daily.log"
      - name: Persist refreshed Chrome profile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/gphotos-profile" ] || ! command -v rclone >/dev/null; then
            echo "No worker profile to persist"
            exit 0
          fi
          rm -f "$HOME/gphotos-profile/SingletonLock" "$HOME/gphotos-profile/SingletonSocket" "$HOME/gphotos-profile/SingletonCookie"
          tar -C "$HOME" -czf /tmp/profile-refresh.tgz gphotos-profile
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/profile-refresh.tgz -out /tmp/profile-refresh.enc -pass env:GPHOTOS_PROFILE_KEY
          rclone copyto /tmp/profile-refresh.enc 'koofr_remote:/Google Photos/.gphotos-sync/auth/profile.tar.gz.enc' --ignore-times
          rm -f /tmp/profile-refresh.tgz /tmp/profile-refresh.enc
      - name: Cleanup worker credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$HOME/gphotos-profile" /tmp/gphotos-downloads /tmp/gphotos-state || true
          rm -f "$HOME/.config/rclone/rclone.conf" || true

      - name: Daily health report
        if: always()
        shell: bash
        env:
          BACKUP_RESULT: ${{ steps.backup.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gphotos-daily.log'
          content = log.read_text(errors='replace') if log.exists() else ''
          summaries = [line[len('SUMMARY='):] for line in content.splitlines() if line.startswith('SUMMARY=')]
          data = {}
          if summaries:
              try: data = json.loads(summaries[-1])
              except ValueError: pass
          status = 'SUCCESS' if os.environ.get('BACKUP_RESULT') == 'success' and data and data.get('errors', 0) == 0 else 'FAILED / INCOMPLETE'
          report = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'status': status, 'backup_step': os.environ.get('BACKUP_RESULT', 'unknown'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_url': f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              'discovered': data.get('discovered'), 'attempted': data.get('attempted'),
              'uploaded': data.get('uploaded'), 'skipped': data.get('skipped'),
              'errors': data.get('errors'), 'boundary_seen': data.get('boundary_seen'),
              'bootstrap_complete': data.get('checkpoint', {}).get('bootstrap_complete') if isinstance(data.get('checkpoint'), dict) else None,
              'upload_error_lines': len(re.findall(r'^UPLOAD_ERROR', content, re.M)),
              'summary_present': bool(data),
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'daily-health.json'
          out.write_text(json.dumps(report, indent=2) + '\\n')
          lines = ['## Google Photos daily health', '', f"**Status:** {status}", '',
                   '| Metric | Value |', '|---|---|']
          for key in ('generated_at_utc','discovered','attempted','uploaded','skipped','errors','boundary_seen','bootstrap_complete','summary_present'):
              lines.append(f"| {key} | {report[key]} |")
          lines.extend(['', f"[Open run]({report['run_url']})"])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write('\\n'.join(lines) + '\\n')
          print('DAILY_HEALTH=' + json.dumps(report))
          PY
      - name: Upload daily health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-health-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-health.json
          if-no-files-found: warn
          retention-days: 90
