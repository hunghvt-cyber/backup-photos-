name: Final State Verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y rclone sqlite3
          mkdir -p "$HOME/.config/rclone"
          PASS="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          printf '[koofr_remote]\ntype = webdav\nurl = https://app.koofr.net/dav/Koofr\nvendor = other\nuser = %s\npass = %s\n' "$KOOFR_USER" "$PASS" > "$HOME/.config/rclone/rclone.conf"
          rclone copyto 'koofr_remote:/Google Photos/.gphotos-sync/manifest.sqlite' /tmp/m.sqlite
          echo "MANIFEST_COUNT=$(sqlite3 /tmp/m.sqlite "select count(*) from media where status='uploaded';")"
          echo "ERROR_COUNT=$(sqlite3 /tmp/m.sqlite "select count(*) from media where status='error';")"
          echo "REMOTE_FILE_COUNT=$(rclone lsf -R --files-only 'koofr_remote:/Google Photos/Photos' | wc -l)"
          sqlite3 /tmp/m.sqlite "select id,status,filename,size from media order by uploaded_at;"
