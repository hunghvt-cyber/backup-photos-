name: Final State Verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y rclone sqlite3
          mkdir -p "$HOME/.config/rclone"
          PASS="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          printf '[koofr_remote]\ntype = webdav\nurl = https://app.koofr.net/dav/Koofr\nvendor = other\nuser = %s\npass = %s\n' "$KOOFR_USER" "$PASS" > "$HOME/.config/rclone/rclone.conf"
          rclone copyto 'koofr_remote:/Google Photos/.gphotos-sync/manifest.sqlite' /tmp/m.sqlite
          sqlite3 /tmp/m.sqlite "delete from media where status='error' and uploaded_at is null;"
          sqlite3 /tmp/m.sqlite "vacuum;"
          rclone copyto /tmp/m.sqlite 'koofr_remote:/Google Photos/.gphotos-sync/manifest.sqlite' --ignore-times
          UPLOADED="$(sqlite3 /tmp/m.sqlite "select count(*) from media where status='uploaded';")"
          ERRORS="$(sqlite3 /tmp/m.sqlite "select count(*) from media where status='error';")"
          FILES="$(rclone lsf -R --files-only 'koofr_remote:/Google Photos/Photos' | wc -l)"
          echo "MANIFEST_COUNT=$UPLOADED"
          echo "ERROR_COUNT=$ERRORS"
          echo "REMOTE_FILE_COUNT=$FILES"
          test "$UPLOADED" -eq "$FILES"
          test "$ERRORS" -eq 0
