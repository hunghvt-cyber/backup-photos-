name: Inspect Backup State
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
    steps:
      - name: Inspect manifest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rclone sqlite3
          mkdir -p "$HOME/.config/rclone"
          PASS="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          {
            echo '[koofr_remote]'
            echo 'type = webdav'
            echo 'url = https://app.koofr.net/dav/Koofr'
            echo 'vendor = other'
            echo "user = $KOOFR_USER"
            echo "pass = $PASS"
          } > "$HOME/.config/rclone/rclone.conf"
          rclone copyto 'koofr_remote:/Google Photos/.gphotos-sync/manifest.sqlite' /tmp/manifest.sqlite
          echo "MANIFEST_SIZE=$(stat -c %s /tmp/manifest.sqlite)"
          sqlite3 /tmp/manifest.sqlite "select id,status,filename,size,remote from media order by uploaded_at desc limit 10;"
          echo "COUNT=$(sqlite3 /tmp/manifest.sqlite "select count(*) from media;")"
          rclone cat 'koofr_remote:/Google Photos/.gphotos-sync/daily-checkpoint.json'
          echo '--- PRODUCTION FILES ---'
          rclone lsl 'koofr_remote:/Google Photos/Photos'
