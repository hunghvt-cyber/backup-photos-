name: Clean Google Photos POC files

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cleanup-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rclone

      - name: Configure Koofr
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          KOOFR_PASS_OBSCURED="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          {
            echo "[koofr_remote]"
            echo "type = webdav"
            echo "url = https://app.koofr.net/dav/Koofr"
            echo "vendor = other"
            echo "user = $KOOFR_USER"
            echo "pass = $KOOFR_PASS_OBSCURED"
          } > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Remove POC media only
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          rclone lsf "koofr_remote:/Google Photos/POC" 2>/dev/null || true
          rclone lsf "koofr_remote:/Google Photos/POC-Actions" 2>/dev/null || true

          rclone purge "koofr_remote:/Google Photos/POC" || true
          rclone purge "koofr_remote:/Google Photos/POC-Actions" || true

          echo "Verify protected state still exists:"
          rclone lsf "koofr_remote:/Google Photos/.gphotos-sync/auth" --include "profile.tar.gz.enc"
          test "$(rclone lsf "koofr_remote:/Google Photos/.gphotos-sync/auth" --include "profile.tar.gz.enc" | grep -c '^profile.tar.gz.enc$')" -eq 1

          echo "RESULT=POC_CLEANUP_OK"

      - name: Cleanup credentials
        if: always()
        run: rm -f "$HOME/.config/rclone/rclone.conf" || true
