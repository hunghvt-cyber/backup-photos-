name: Read-only RAW chooser proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/raw-chooser-proof-once.yml']
permissions:
  contents: read
concurrency:
  group: raw-original-proof-readonly
  cancel-in-progress: false
jobs:
  proof:
    if: github.event.head_commit.message == 'Read-only RAW chooser proof once 20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KOOFR_USER: ${{ secrets.KOOFR_USER }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
      GPHOTOS_PROFILE_KEY: ${{ secrets.GPHOTOS_PROFILE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Download-only proof on private profile copy; never write manifest or cloud profile
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORK="$(mktemp -d)"
          trap 'rm -rf -- "$WORK"; rm -f -- "$HOME/.config/rclone/rclone.conf"' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          mkdir -p "$HOME/.config/rclone"
          PASS="$(rclone obscure "$KOOFR_APP_PASSWORD")"
          printf '[koofr_remote]\ntype = webdav\nurl = https://app.koofr.net/dav/Koofr\nvendor = other\nuser = %s\npass = %s\n' "$KOOFR_USER" "$PASS" > "$HOME/.config/rclone/rclone.conf"
          AUTH='koofr_remote:/Google Photos/.gphotos-sync'
          rclone copyto "$AUTH/auth/profile.tar.gz.enc" "$WORK/profile.enc" --retries 1 --timeout 60s
          rclone copyto "$AUTH/manifest.sqlite" "$WORK/manifest.sqlite" --retries 1 --timeout 30s
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$WORK/profile.enc" -out "$WORK/profile.tgz" -pass env:GPHOTOS_PROFILE_KEY
          tar -C "$WORK" -xzf "$WORK/profile.tgz"
          rm -f "$WORK/gphotos-profile"/Singleton*
          python3 - "$WORK" <<'PY'
          import sys,sqlite3,json,logging,shutil,re
          from pathlib import Path
          from types import SimpleNamespace as NS
          from playwright.sync_api import sync_playwright
          from src.gphotos_web_backup import BoundedClient,execute,export_cookies,WebBackup
          from src.gphotos_sync import RAW_EXTENSIONS,validate_media
          from gpwc import payloads
          work=Path(sys.argv[1])
          logging.disable(logging.CRITICAL)
          chrome=shutil.which('google-chrome-stable') or shutil.which('google-chrome')
          with sync_playwright() as pw:
              context=pw.chromium.launch_persistent_context(str(work/'gphotos-profile'),executable_path=chrome,headless=True,args=['--disable-dev-shm-usage','--no-first-run'])
              try:
                  page=context.pages[0] if context.pages else context.new_page()
                  page.goto('https://photos.google.com/',wait_until='domcontentloaded',timeout=90000)
                  page.wait_for_timeout(3000)
                  export_cookies(context,work/'cookies.txt')
              finally:
                  context.close()
          client=BoundedClient(work/'cookies.txt',log_level='CRITICAL')
          with sqlite3.connect((work/'manifest.sqlite').as_uri()+'?mode=ro',uri=True) as db:
              assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
              print('DURABLE_BACKUP_COUNTS='+json.dumps(dict(db.execute('SELECT status,COUNT(*) FROM media GROUP BY status'))),flush=True)
              rows=db.execute("SELECT id FROM media WHERE status='error' ORDER BY id").fetchall()
              chosen={}
              for (media,) in rows:
                  ext=execute(client,payloads.GetItemInfoExt(media_key=media))
                  suffix=Path(ext.file_name or '').suffix.lower()
                  if suffix in RAW_EXTENSIONS and suffix not in chosen:
                      chosen[suffix]=(media,ext.size)
                  if len(chosen)>=2:
                      break
              downloads=work/'downloads'
              downloads.mkdir()
              worker=WebBackup.__new__(WebBackup)
              worker.db=db
              worker.e=NS(a=NS(profile=str(work/'gphotos-profile'),chrome=chrome),wd=downloads)
              results=[]
              for suffix,(media,expected) in chosen.items():
                  try:
                      path,name=worker.browser_unmodified_original(media,expected,raw_allowed=True)
                      validate_media(path,name,'photo')
                      result={'suffix':suffix,'expected_bytes':expected,'actual_bytes':path.stat().st_size,'verified':True}
                  except Exception as exc:
                      code=str(exc) if re.fullmatch('[A-Z_]+',str(exc)) else type(exc).__name__
                      result={'suffix':suffix,'verified':False,'code':code}
                  results.append(result)
                  print('READ_ONLY_RAW_PROOF='+json.dumps(result),flush=True)
              print('READ_ONLY_RAW_SUMMARY='+json.dumps({'attempted':len(results),'verified':sum(r['verified'] for r in results),'cloud_writes':0,'manifest_writes':0}),flush=True)
              failed=not results or not all(r['verified'] for r in results)
          raise SystemExit(int(failed))
          PY
