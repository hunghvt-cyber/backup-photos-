name: Recover real daily report only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download original aggregate health artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-health-39343563085
          path: recovery
          run-id: 39343563085
          github-token: ${{ github.token }}
      - name: Validate original run and publish its unchanged measurements
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: '39343563085'
          REPORT_GAS_URL: ${{ vars.REPORT_GAS_URL }}
          REPORT_GAS_KEY: ${{ secrets.REPORT_GAS_KEY }}
        run: python3 scripts/recover_daily_report.py
